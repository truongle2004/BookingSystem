spring:
  application:
    name: bookingsystem
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      connection-timeout: ${DB_CONNECT_TIMEOUT:3000}
      maximum-pool-size: ${DB_POOL_MAX:10}
  flyway:
    enabled: false
  jdbc:
    template:
      query-timeout: ${DB_QUERY_TIMEOUT:5s}
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
server:
  address: ${HTTP_ADDRESS:0.0.0.0}
  port: ${HTTP_PORT:8080}
  shutdown: graceful
  tomcat:
    connection-timeout: ${HTTP_READ_TIMEOUT:5s}
spring.lifecycle.timeout-per-shutdown-phase: 20s
logging:
  level:
    root: ${LOG_LEVEL:INFO}
  structured:
    format:
      console: ${CONSOLE_LOG_STRUCTURED_FORMAT:logstash}
      file: ${FILE_LOG_STRUCTURED_FORMAT:logstash}
management:
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:0.1}
  opentelemetry:
    resource-attributes:
      service.namespace: bookingsystem
scalar:
  enabled: true
  path: /scalar
  url: /openapi.yaml
app:
  environment: ${APP_ENV}
  clerk:
    # Clerk's issuer URL, for example: https://<instance>.clerk.accounts.dev
    issuer-uri: ${CLERK_ISSUER_URI:}
    # Optional explicit JWKS endpoint. Leave unset to use issuer metadata discovery.
    jwk-set-uri: ${CLERK_JWK_SET_URI:}
    # Optional audience claim required by this API.
    audience: ${CLERK_AUDIENCE:}
    # Comma-separated frontend origins accepted from Clerk's azp claim.
    authorized-parties: ${CLERK_AUTHORIZED_PARTIES:}
    clock-skew: ${CLERK_CLOCK_SKEW:30s}
    jwk-connect-timeout: ${CLERK_JWK_CONNECT_TIMEOUT:3s}
    jwk-read-timeout: ${CLERK_JWK_READ_TIMEOUT:5s}
